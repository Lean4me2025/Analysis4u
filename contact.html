<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – Analysis4U</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header / Nav -->
  <header class="site-header">
    <div class="logo">ANALYSIS4U</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Tell me what you need analyzed</h1>
      <p>
        Share a bit about your business, process issue, or data problem.
        I’ll review it personally and follow up with clear, practical next steps.
      </p>

      <form id="contactForm" class="contact-form">
        <div class="form-grid">
          <div class="form-field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required />
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-field">
            <label for="company">Company</label>
            <input type="text" id="company" name="company" />
          </div>

          <div class="form-field">
            <label for="address">Business Address / City / ZIP</label>
            <input type="text" id="address" name="address" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-field">
            <label for="problem">What problem are you trying to solve?</label>
            <textarea
              id="problem"
              name="problem"
              rows="4"
              placeholder="Describe the issue, trend, or decision you need clarity on."
              required
            ></textarea>
          </div>

          <div class="form-field">
            <label for="outcome">What outcome do you hope to achieve?</label>
            <textarea
              id="outcome"
              name="outcome"
              rows="4"
              placeholder="Example: reduce incidents, improve workflow, find cost savings, see patterns."
            ></textarea>
          </div>
        </div>

        <button type="submit" class="primary-button">Send Message</button>

        <p id="formStatus" class="form-status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Analysis4U · Drew Harris</p>
  </footer>

  <script>
    // 🔗 Your Apps Script Web App URL (the one that ends with /exec)
    const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("formStatus");
    const yearEl = document.getElementById("year");

    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      statusEl.textContent = "Sending...";
      statusEl.classList.remove("error", "success");

      const payload = {
        fullName: form.fullName.value.trim(),
        email: form.email.value.trim(),
        company: form.company.value.trim(),
        address: form.address.value.trim(),
        problem: form.problem.value.trim(),
        outcome: form.outcome.value.trim(),
      };

      try {
        // Fire-and-forget style; we don't need to read the response body.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        statusEl.textContent =
          "Thanks! Your message has been sent. I’ll follow up with next steps.";
        statusEl.classList.add("success");
        form.reset();
      } catch (err) {
        console.error(err);
        statusEl.textContent =
          "Something went wrong sending your message. Please try again or email me directly at drewhrs2@gmail.com.";
        statusEl.classList.add("error");
      }
    });
  </script>
</body>
</html>
